# Kormo HR — local development infrastructure.
# Non-default host ports on purpose: the host may already run its own
# Postgres/Redis/MinIO, and we never want to collide with them.
name: kormo-hr

services:
  postgres:
    image: postgres:16-alpine
    container_name: kormo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kormo
      POSTGRES_PASSWORD: kormo_dev_pw
      POSTGRES_DB: kormo_hr
      # deterministic collation so ORDER BY matches between dev machines
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "55432:5432"
    volumes:
      - kormo_pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kormo -d kormo_hr"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kormo-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - kormo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: kormo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: kormo
      MINIO_ROOT_PASSWORD: kormo_dev_pw
    ports:
      - "59000:9000"   # S3 API
      - "59001:9001"   # console
    volumes:
      - kormo_miniodata:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Creates the bucket on first boot so the API never has to bootstrap storage.
  minio-init:
    image: minio/mc:latest
    container_name: kormo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kormo kormo_dev_pw &&
      mc mb --ignore-existing local/kormo-media &&
      mc anonymous set download local/kormo-media/public &&
      echo 'kormo-media bucket ready'
      "

volumes:
  kormo_pgdata:
  kormo_redisdata:
  kormo_miniodata:

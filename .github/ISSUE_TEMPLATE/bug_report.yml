name: Bug report
description: Something behaves differently from how it should
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        The seed data is deterministic, so a bug in it reproduces exactly.
        Naming the employee, month or request involved usually makes a report
        actionable on the first read.

        **Security problems do not belong here** — use
        [private reporting](https://github.com/nazmul284/kormo-hr/security/advisories/new).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as `manager`
        2. Open Leave → Approvals
        3. …
    validations:
      required: true

  - type: dropdown
    id: country
    attributes:
      label: Country pack
      description: The SEED_COUNTRY the database was seeded with.
      options:
        - INTL (default)
        - US
        - GB
        - IN
        - AE
        - BD
        - Not sure
    validations:
      required: true

  - type: input
    id: account
    attributes:
      label: Demo account
      placeholder: md, hr.admin, manager, employee, payroll, field, admin

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Node: 20.x
        OS: macOS 15 / Ubuntu 24.04
        Browser: Chrome 130
        Commit: (git rev-parse --short HEAD)

  - type: textarea
    id: logs
    attributes:
      label: Console or server output
      description: Anything relevant. It is rendered as code, no backticks needed.
      render: shell

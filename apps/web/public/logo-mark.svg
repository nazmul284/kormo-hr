<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kormo HR">
  <title>Kormo HR</title>
  <defs>
    <linearGradient id="kormoTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <radialGradient id="kormoGloss" cx="0.22" cy="0.16" r="0.85">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="15" fill="url(#kormoTile)"/>
  <rect width="64" height="64" rx="15" fill="url(#kormoGloss)"/>

  <!-- K: stem = the person, upper arm = ascending growth chevron -->
  <rect x="16" y="15" width="7.5" height="34" rx="3.75" fill="#FFFFFF"/>
  <path d="M27.5 32 L46 16" fill="none" stroke="#5EEAD4" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M27.5 32 L46 48" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>
</svg>
